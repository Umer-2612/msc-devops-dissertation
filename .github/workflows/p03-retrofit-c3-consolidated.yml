# ============================================================
# Project 03: Retrofit (Java/Kotlin HTTP client)
# Config C3 (consolidation): structurally identical to C1.
#
# Retrofit's reproducible CI surface is the single self-contained `jvm` job
# (Section 3.2.5); there is nothing to consolidate, so this file is
# intentionally identical to C1 except for its name and artifact label,
# recorded separately so the C1-versus-C3 comparison can confirm no
# systematic difference beyond measurement noise, as with got.
# ============================================================
name: P03 Retrofit C3 Consolidated

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false -Dorg.gradle.logging.stacktrace=full"

jobs:
  test:
    name: JVM build
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout retrofit at 2.12.0
        uses: actions/checkout@v4
        with:
          repository: lysine-dev/retrofit
          ref: '2.12.0'

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version

      - name: Run core module tests
        run: ./gradlew :retrofit:test

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p03-c3-tests
          path: /tmp/eco-ci/
          retention-days: 30
