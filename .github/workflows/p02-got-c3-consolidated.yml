# ============================================================
# Project 02: got (JavaScript/TypeScript HTTP client)
# Config C3 (consolidation): structurally identical to C1.
#
# got's own CI is already a single workflow file, so there is nothing to
# consolidate (Section 3.2.5). This file exists so the data-collection
# pipeline can still record a C3-labelled measurement for got, and the
# expectation — stated explicitly here rather than discovered as a surprise
# in the results — is that C1 and C3 for this project should show no
# systematic difference beyond measurement noise, which is itself a useful
# internal check on the measurement methodology.
# ============================================================
name: P02 got C3 Consolidated

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout got at v15.1.0
        uses: actions/checkout@v4
        with:
          repository: sindresorhus/got
          ref: 'v15.1.0'

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Eco-CI dependency-installation measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'dependency-installation'
        continue-on-error: true

      - name: Run tests
        run: npm run test

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p02-c3-tests-node${{ matrix.node-version }}
          path: /tmp/eco-ci/
          retention-days: 30
