# ============================================================
# Project 03: Retrofit (Java/Kotlin HTTP client)
# Config C4 (combined): Gradle caching + path filters (nothing to consolidate, see C3).
# Checks out lysine-dev/retrofit@2.12.0 externally; no modifications to the source.
#
# Path-based trigger filters are omitted from the trigger itself for the
# same monorepo reason as got's C4 (Section 3.3): a real push trigger here
# would fire on unrelated commits elsewhere in this repository. All research
# runs are triggered manually via workflow_dispatch against a fixed
# external ref, so this construct-validity limitation is unaffected either way.
# ============================================================
name: P03 Retrofit C4 Combined

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false -Dorg.gradle.logging.stacktrace=full"

jobs:
  test:
    name: JVM build
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout retrofit at 2.12.0
        uses: actions/checkout@v4
        with:
          repository: lysine-dev/retrofit
          ref: '2.12.0'

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p03-c4-tests
          path: /tmp/eco-ci/
          retention-days: 30
