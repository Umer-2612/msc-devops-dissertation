# ============================================================
# Project 05: Gson (Java JSON library) — size-axis observation
# Config C1 (baseline): no caching, no consolidation
# Checks out google/gson@gson-parent-2.14.0 externally; no modifications to the source.
#
# Gson is included as the size-axis project (Section 3.2.2): a larger,
# differently-scoped project (Maven, multi-module) analysed separately from
# the HTTP-client cross-language arm, to test whether strategy effects hold
# as project size and build complexity increase (motivated by Section 2.3.4).
#
# Gson's own CI runs a Java-version matrix (11/17/21/25) plus native-image,
# reproducible-build, and API-subset jobs. Only the core `mvn test` path on
# a single mainstream JDK (21) is reproduced here, excluding the release-
# engineering jobs (GraalVM native-image, reproducible-build verification)
# that are unrelated to the test suite itself and add complexity outside
# this study's scope (Section 3.2.1).
# ============================================================
name: P05 Gson C1 Tests

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

env:
  MAVEN_ARGS: --show-version --batch-mode --no-transfer-progress

jobs:
  test:
    name: Build on JDK 21
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout gson at gson-parent-2.14.0
        uses: actions/checkout@v4
        with:
          repository: google/gson
          ref: 'gson-parent-2.14.0'

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run tests
        run: mvn test

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p05-c1-tests
          path: /tmp/eco-ci/
          retention-days: 30
