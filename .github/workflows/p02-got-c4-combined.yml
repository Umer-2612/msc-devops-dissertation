# ============================================================
# Project 02: got (JavaScript/TypeScript HTTP client)
# Config C4 (combined): caching + path filters (nothing to consolidate, see C3).
# Checks out sindresorhus/got@v15.1.0 externally; no modifications to the source.
#
# Path-based trigger filters (paths-ignore: **.md, documentation/**, media/**,
# benchmark/**) are omitted from the trigger itself because this repository
# is a monorepo hosting every project's workflows: a real push trigger here
# would fire on unrelated commits elsewhere in the repo (other projects,
# dissertation edits), not just got-relevant changes. All research runs are
# triggered manually via workflow_dispatch against a fixed external ref, so
# this construct-validity limitation is unaffected either way (Section 3.3).
# ============================================================
name: P02 got C4 Combined

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout got at v15.1.0
        uses: actions/checkout@v4
        with:
          repository: sindresorhus/got
          ref: 'v15.1.0'

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Eco-CI dependency-installation measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'dependency-installation'
        continue-on-error: true

      - name: Run tests
        run: npm run test

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p02-c4-tests-node${{ matrix.node-version }}
          path: /tmp/eco-ci/
          retention-days: 30
