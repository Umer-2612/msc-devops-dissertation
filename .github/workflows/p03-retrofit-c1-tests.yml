# ============================================================
# Project 03: Retrofit (Java/Kotlin HTTP client)
# Config C1 (baseline): no caching, no consolidation
# Checks out lysine-dev/retrofit@2.12.0 externally; no modifications to the source.
#
# Retrofit's own CI (.github/workflows/build.yml) defines five jobs: jvm,
# android, robovm, website, and publish. Only `jvm` is reproduced here: the
# others require an Android emulator with KVM, a macOS runner, secrets for
# Maven Central publishing, or a documentation build unrelated to the test
# suite, none of which satisfy the inclusion criteria in Section 3.2.1
# (self-contained, no secrets/external services, ubuntu-latest only).
#
# As with got (Section 3.2.5), Retrofit's `jvm` job is a single self-contained
# unit with nothing to consolidate, so C1 and C3 are structurally identical.
#
# The measured command is further narrowed from the project's own `./gradlew
# build` to `./gradlew :retrofit:test`: `build` also exercises the
# `java-test` submodule's per-JDK-version compatibility suite (testJdk10,
# testJdk11, ...), which failed intermittently on a toolchain-provisioning
# issue unrelated to caching or consolidation. Measuring only the core
# library's own test task avoids that unrelated noise, mirroring the
# `make test`-not-`make test-all` scoping already applied to HTTPie.
# ============================================================
name: P03 Retrofit C1 Tests

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false -Dorg.gradle.logging.stacktrace=full"

jobs:
  test:
    name: JVM build
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout retrofit at 2.12.0
        uses: actions/checkout@v4
        with:
          repository: lysine-dev/retrofit
          ref: '2.12.0'

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version

      - name: Run core module tests
        run: ./gradlew :retrofit:test

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p03-c1-tests
          path: /tmp/eco-ci/
          retention-days: 30
