# ============================================================
# Project 05: Gson (Java JSON library) — size-axis observation
# Config C4 (combined): Maven caching + path filters (nothing to consolidate, see C3).
# Checks out google/gson@gson-parent-2.14.0 externally; no modifications to the source.
#
# Path-based trigger filters are omitted from the trigger itself for the
# same monorepo reason as the other projects' C4 (Section 3.3). All
# research runs are triggered manually via workflow_dispatch against a
# fixed external ref.
# ============================================================
name: P05 Gson C4 Combined

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

env:
  MAVEN_ARGS: --show-version --batch-mode --no-transfer-progress

jobs:
  test:
    name: Build on JDK 21
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout gson at gson-parent-2.14.0
        uses: actions/checkout@v4
        with:
          repository: google/gson
          ref: 'gson-parent-2.14.0'

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run core module tests
        run: mvn test --projects gson

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p05-c4-tests
          path: /tmp/eco-ci/
          retention-days: 30
