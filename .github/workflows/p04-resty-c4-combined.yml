# ============================================================
# Project 04: resty (Go HTTP and REST client library)
# Config C4 (combined): Go module/build caching + path filters (nothing to consolidate, see C3).
# Checks out go-resty/resty@v2.17.2 externally; no modifications to the source.
#
# Path-based trigger filters are omitted from the trigger itself for the
# same monorepo reason as got's and Retrofit's C4 (Section 3.3). All
# research runs are triggered manually via workflow_dispatch against a
# fixed external ref.
# ============================================================
name: P04 resty C4 Combined

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

jobs:
  test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout resty at v2.17.2
        uses: actions/checkout@v4
        with:
          repository: go-resty/resty
          ref: 'v2.17.2'
          fetch-depth: 0

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Eco-CI dependency-installation measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'dependency-installation'
        continue-on-error: true

      - name: Format check
        run: diff -u <(echo -n) <(go fmt $(go list ./...))

      - name: Eco-CI lint measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'lint'
        continue-on-error: true

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./...

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p04-c4-tests
          path: /tmp/eco-ci/
          retention-days: 30
