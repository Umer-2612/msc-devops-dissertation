# ============================================================
# Project 04: resty (Go HTTP and REST client library)
# Config C1 (baseline): no caching, no consolidation
# Checks out go-resty/resty@v2.17.2 externally; no modifications to the source.
#
# resty's own CI is a single workflow file with a Go version matrix
# (stable, 1.20.x); simplified here to 'stable' only to reduce runtime,
# mirroring the Python-matrix trim applied to HTTPie in the pre-study audit
# (Appendix A). Nothing to consolidate (single self-contained job), so C1
# and C3 are structurally identical, matching got and Retrofit.
# ============================================================
name: P04 resty C1 Tests

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run label (e.g. run-01)'
        required: false
        default: 'research run'

jobs:
  test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Eco-CI Start Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
        continue-on-error: true

      - name: Checkout resty at v2.17.2
        uses: actions/checkout@v4
        with:
          repository: go-resty/resty
          ref: 'v2.17.2'
          fetch-depth: 0

      - name: Eco-CI checkout measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'checkout'
        continue-on-error: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Eco-CI dependency-installation measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'dependency-installation'
        continue-on-error: true

      - name: Format check
        run: diff -u <(echo -n) <(go fmt $(go list ./...))

      - name: Eco-CI lint measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'lint'
        continue-on-error: true

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./...

      - name: Eco-CI test-execution measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: 'test-execution'
        continue-on-error: true

      - name: Eco-CI display results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
          json-output: true
        continue-on-error: true

      - name: Upload Eco-CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eco-ci-p04-c1-tests
          path: /tmp/eco-ci/
          retention-days: 30
